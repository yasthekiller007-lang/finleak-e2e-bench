name: Application checks
on:
  push:
    branches: [main, phase3/document-intelligence, phase4/leakage-compiler-engine, phase5/leakage-proof-engine, phase6/recovery-ledger-implementation, phase7/pilot-readiness-hardening, hotfix/phase7-post-merge-runtime-pin, hotfix/phase7-scanner-readiness-metadata]
  pull_request:

permissions:
  contents: read

env:
  RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_USER: financial_leakage
          POSTGRES_DB: financial_leakage_test
          POSTGRES_INITDB_ARGS: "--set=track_commit_timestamp=on"
          # Disposable CI-only credential, generated by the runner; no repository secret.
          POSTGRES_PASSWORD: ${{ github.run_id }}
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U financial_leakage -d financial_leakage_test"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      FLA_ENVIRONMENT: test
      FLA_DATABASE_URL: postgresql+psycopg://financial_leakage:${{ github.run_id }}@127.0.0.1:5432/financial_leakage_test
      TEST_DATABASE_URL: postgresql+psycopg://financial_leakage:${{ github.run_id }}@127.0.0.1:5432/financial_leakage_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.19"
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run pytest -q --junitxml=../.local/phase7/backend.xml
      - run: uv run python -m app.intelligence.benchmark
      - run: uv run python ../tools/secret_scan.py
      - run: uv run python ../tools/phase7_policy_gate.py
      - run: uv run python ../tools/phase7_fault_gate.py
      - uses: actions/upload-artifact@v4
        with:
          name: phase7-fault-fixtures-${{ env.RELEASE_SHA }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
          path: .local/phase7/faults.json
      - name: Validate reversible migration chain on disposable database
        run: uv run python -m acceptance.migration_roundtrip

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test -- --reporter=json --outputFile=../.local/phase7/frontend-raw.json
      - run: node --version
      - run: python ../tools/phase7_frontend_receipt.py
      - uses: actions/upload-artifact@v4
        with:
          name: phase7-frontend-fixtures-${{ env.RELEASE_SHA }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
          path: .local/phase7/frontend.json
      - run: npm run build

  runtime-images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Build the production contract without credentials or test harnesses
        run: docker build -f deploy/phase7/${{ matrix.component }}.Dockerfile --build-arg RELEASE_SHA=${{ env.RELEASE_SHA }} -t phase7-${{ matrix.component }}:ci .
      - name: Verify non-root and fail-closed unconfigured runtime
        run: |
          set -eu
          image=phase7-${{ matrix.component }}:ci
          image_user=$(docker inspect --format '{{.Config.User}}' "$image")
          test -n "$image_user"
          test "$image_user" != root
          test "$image_user" != 0
          status=0
          timeout 30 docker run --rm "$image" > /tmp/phase7-runtime-smoke.txt 2>&1 || status=$?
          test "$status" -ne 0
          test "$status" -ne 124
          # No real settings were provided. A listening unauthenticated runtime is a failure.
      - name: Backend image must not contain identity fixture code
        if: matrix.component == 'backend'
        run: docker run --rm --entrypoint python phase7-backend:ci -c "from pathlib import Path; assert not Path('/app/tests').exists(); assert not Path('/app/e2e').exists(); assert not Path('/app/acceptance').exists()"

      - name: Verify installed backend libseccomp package and ABI
        if: matrix.component == 'backend'
        run: |
          docker run --rm -i --read-only --cap-drop ALL --security-opt no-new-privileges --entrypoint python phase7-backend:ci - <<'PY'
          import ctypes
          import json
          import platform
          import subprocess
          from pathlib import Path

          installed = subprocess.check_output(["apk", "list", "--installed", "--manifest", "libseccomp"], timeout=10).decode().split()
          assert installed == ["libseccomp", "2.6.1-r0"], installed
          package = "-".join(installed)
          class Version(ctypes.Structure):
              _fields_ = [(name, ctypes.c_uint) for name in ("major", "minor", "micro")]
          library = ctypes.CDLL("libseccomp.so.2")
          library.seccomp_version.restype = ctypes.POINTER(Version)
          version = library.seccomp_version().contents
          actual = (version.major, version.minor, version.micro)
          assert actual == (2, 6, 1), actual
          for name in ("seccomp_init", "seccomp_syscall_resolve_name", "seccomp_rule_add", "seccomp_load", "seccomp_release"):
              assert getattr(library, name)
          repositories = Path("/etc/apk/repositories").read_text().splitlines()
          assert repositories == ["https://dl-cdn.alpinelinux.org/alpine/v3.24/main", "https://dl-cdn.alpinelinux.org/alpine/v3.24/community"], repositories
          print(json.dumps({"package": package, "abi": "libseccomp.so.2", "version": actual, "architecture": platform.machine(), "repositories": repositories}))
          PY

      - name: Backend child confinement under non-root read-only container controls
        if: matrix.component == 'backend'
        run: docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp:size=16m,mode=1777 --entrypoint python phase7-backend:ci -m app.intelligence.confinement_probe

  storage-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.19"
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24.8"
          cache: false
      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: phase7-minio-9e49d5e7a648f00e26f2246f4dc28e6b07f8c84a-go1.24.8-${{ runner.os }}
      - run: uv sync --locked
      - name: Build the CVE-fixed test service from immutable official source
        run: go install -trimpath github.com/minio/minio@9e49d5e7a648f00e26f2246f4dc28e6b07f8c84a
      - name: Run isolated exact-source S3 conformance without customer data
        run: PHASE7_MINIO_BINARY="$(go env GOPATH)/bin/minio" uv run python -m acceptance.storage_integration

  scanner-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.19"
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Build the qualified engine with upstream-patched OS libraries
        run: |
          set -eu
          docker build -f ../deploy/phase7/scanner/Dockerfile --build-arg RELEASE_SHA=${{ env.RELEASE_SHA }} -t phase7-scanner:ci ..
          image=$(docker inspect --format '{{.Id}}' phase7-scanner:ci)
          echo "PHASE7_CLAMAV_IMAGE=$image" >> "$GITHUB_ENV"
      - name: Actual private offline engine with harmless signature and exact bytes
        run: uv run python -m acceptance.scanner_integration

  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GRYPE_DB_AUTO_UPDATE: "false"
      GRYPE_CHECK_FOR_APP_UPDATE: "false"
      GRYPE_DB_VALIDATE_BY_HASH_ON_START: "true"
      GRYPE_DB_MAX_ALLOWED_BUILT_AGE: 120h
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify pinned official advisory scanner archive
        run: |
          set -eu
          curl --fail --location --max-time 60 --retry 2 https://github.com/anchore/grype/releases/download/v0.120.0/grype_0.120.0_linux_amd64.tar.gz -o /tmp/grype.tar.gz
          echo 'a5a1218dce63acdac152a6b3b5bb366e7267e36f4069848cf455543b3fa5700e  /tmp/grype.tar.gz' | sha256sum --check
          tar -xzf /tmp/grype.tar.gz -C /tmp grype
          /tmp/grype version -o json
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pilot-advisory
          key: grype-0.120.0-v6-2bd87418b8877e75d07351ef8daa9636ef98d69e09e0f69a15ae9c191e895d39
      - name: Import the recorded checksum-pinned advisory database snapshot
        run: |
          set -eu
          url='https://grype.anchore.io/databases/v6/vulnerability-db_v6.1.10_2026-10-04T01:12:18Z_1791101507.tar.zst?checksum=sha256%3A2bd87418b8877e75d07351ef8daa9636ef98d69e09e0f69a15ae9c191e895d39'
          checksum=2bd87418b8877e75d07351ef8daa9636ef98d69e09e0f69a15ae9c191e895d39
          archive="$HOME/.cache/pilot-advisory/$checksum.tar.zst"
          mkdir -p "$HOME/.cache/pilot-advisory"
          if test ! -f "$archive"; then
            curl --fail --location --max-time 120 --retry 2 "$url" -o "$archive"
          fi
          printf '%s  %s\n' "$checksum" "$archive" | sha256sum --check
          # Always import the hash-verified archive, including on cache hits.
          # A different valid database in Grype's cache cannot replace this pin.
          /tmp/grype db import "$archive"
          /tmp/grype db status -o json
      - name: Scan all exact locked Python and npm versions using the same snapshot
        run: |
          set -eu
          python tools/dependency_inventory.py /tmp/pilot-advisory
          /tmp/grype purl:/tmp/pilot-advisory/python.purl -q -o json > /tmp/pilot-advisory/python.json
          /tmp/grype purl:/tmp/pilot-advisory/npm.purl -q -o json > /tmp/pilot-advisory/npm.json
      - name: Scan actual backend frontend and scanner runtime package inventories
        run: |
          set -eu
          docker build -f deploy/phase7/backend.Dockerfile --build-arg RELEASE_SHA=${{ env.RELEASE_SHA }} -t phase7-backend:advisory .
          docker build -f deploy/phase7/frontend.Dockerfile --build-arg RELEASE_SHA=${{ env.RELEASE_SHA }} -t phase7-frontend:advisory .
          docker build -f deploy/phase7/scanner/Dockerfile --build-arg RELEASE_SHA=${{ env.RELEASE_SHA }} -t phase7-scanner:advisory .
          scanner=phase7-scanner:advisory
          /tmp/grype docker:phase7-backend:advisory -q -o json > /tmp/pilot-advisory/backend-image.json
          /tmp/grype docker:phase7-frontend:advisory -q -o json > /tmp/pilot-advisory/frontend-image.json
          /tmp/grype docker:"$scanner" -q -o json > /tmp/pilot-advisory/scanner-image.json
          test "$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' phase7-frontend:advisory)" = "$RELEASE_SHA"
          docker run --rm -i --read-only --cap-drop ALL --security-opt no-new-privileges --entrypoint node phase7-frontend:advisory - < tools/runtime_dependency_assert.cjs > /tmp/pilot-advisory/runtime-dev-absence.json
          python tools/patched_zlib_assert.py /tmp/pilot-advisory/patched-zlib.json phase7-backend:advisory phase7-frontend:advisory phase7-scanner:advisory
          python tools/advisory_gate.py --patched-zlib-evidence /tmp/pilot-advisory/patched-zlib.json --non-runtime-evidence /tmp/pilot-advisory/runtime-dev-absence.json /tmp/pilot-advisory/python.json /tmp/pilot-advisory/npm.json /tmp/pilot-advisory/backend-image.json /tmp/pilot-advisory/frontend-image.json /tmp/pilot-advisory/scanner-image.json

  restore-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      FLA_ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.19"
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Actual isolated synthetic native backup restore and logical-copy rejection
        run: uv run python -m acceptance.restore_integration

  browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_USER: financial_leakage
          POSTGRES_DB: phase7_browser_test
          POSTGRES_INITDB_ARGS: "--set=track_commit_timestamp=on"
          POSTGRES_PASSWORD: ${{ github.run_id }}
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U financial_leakage -d phase7_browser_test"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      FLA_ENVIRONMENT: test
      PHASE7_SYNTHETIC_ACCEPTANCE: "1"
      FLA_DATABASE_URL: postgresql+psycopg://financial_leakage:${{ github.run_id }}@127.0.0.1:5432/phase7_browser_test
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.19"
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --locked
        working-directory: backend
      - run: uv run alembic upgrade head
        working-directory: backend
      - name: Seed only the disposable synthetic identity roster
        run: uv run python -m acceptance.browser_runtime seed
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium firefox
        working-directory: frontend
      - name: Guarded Chromium journey, second-engine smoke and measured resource samples
        run: npm run test:e2e
        working-directory: frontend
      - name: Require safe complete measurement evidence
        run: python tools/phase7_evidence_gate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase7-synthetic-acceptance-${{ env.RELEASE_SHA }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
          path: |
            .local/phase7/browser.json
            .local/phase7/capacity.json
            .local/phase7/resources.json

  qualification:
    runs-on: ubuntu-latest
    needs: [backend, frontend, runtime-images, storage-conformance, scanner-conformance, supply-chain, restore-conformance, browser-acceptance]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: phase7-*-${{ env.RELEASE_SHA }}
          merge-multiple: true
          path: .local/phase7
      - name: Require every job and fixture receipt on this exact checkout
        env:
          PHASE7_JOB_RESULTS: ${{ toJSON(needs) }}
        run: python tools/phase7_release_receipt.py
      - uses: actions/upload-artifact@v4
        with:
          name: phase7-qualification-${{ github.event_name }}-${{ env.RELEASE_SHA }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
          path: .local/phase7/qualification.json
