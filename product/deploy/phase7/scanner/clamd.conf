# Private no-egress scanner profile. Original bytes are never transformed.
# Production requires separate signature freshness/update and image qualification.
Foreground yes
DatabaseDirectory /var/lib/clamav
LocalSocket /scanner/clamd.sock
LocalSocketMode 660
FixStaleSocket yes
MaxThreads 2
MaxQueue 4
StreamMaxLength 100M
MaxFileSize 100M
MaxScanSize 100M
MaxScanTime 20000
MaxRecursion 16
MaxFiles 1000
HeuristicAlerts yes
AlertExceedsMax yes
AlertOLE2Macros yes
ScanArchive yes
ScanPDF yes
ScanXMLDOCS yes
ScanOLE2 yes
SelfCheck 600
LogClean no
LogVerbose no
LogSyslog no
