services:
  postgres:
    image: postgres:17.11-bookworm
    command: ["postgres", "-c", "track_commit_timestamp=on"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-financial_leakage}
      POSTGRES_DB: ${POSTGRES_DB:-financial_leakage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local development POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
